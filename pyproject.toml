[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "copilot-signal"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "numpy>=1.26",
    "scipy>=1.12",
    "diskcache>=5.6",
    "rich>=13.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "jupyter>=1.0",
    "matplotlib>=3.8",
    "pandas>=2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/copilotsig"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
